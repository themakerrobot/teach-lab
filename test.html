<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teach Lab — 시험실</title>
<meta name="description" content="가르친 AI가 잘 맞히는지 웹캠으로 바로 시험해 보세요.">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FBF7EF">
<link rel="stylesheet" href="assets/fonts/pretendard.css?v=1">
<link rel="stylesheet" href="css/all.min.css?v=1">
<link rel="stylesheet" href="css/maker-ui.css?v=1">
<link rel="stylesheet" href="css/app.css?v=1">
</head>
<body>

<header data-tab="test.html"></header>

<div class="mk-main">

  <div class="pan pan-side" id="panL">
    <div class="ph"><i class="fa-solid fa-cube"></i>내 모델</div>
    <div class="pb">
      <div class="pb-label">어떤 모델로 시험할까요?</div>
      <div id="mdlList"></div>
      <div class="hint" id="mdlHint">
        <i class="fa-solid fa-lightbulb"></i> 아직 저장한 모델이 없어요. 학습실에서 먼저 가르쳐 주세요.
      </div>
    </div>
  </div>

  <div class="pan pan-wide" id="panC">
    <div class="ph"><i class="fa-solid fa-camera"></i>카메라</div>
    <div class="pb">
      <div class="row" style="margin-bottom:10px">
        <button class="db" id="camBtn" style="flex-shrink:0"><i class="fa-solid fa-video"></i> 카메라 켜기</button>
        <select class="inp" id="camSel" style="cursor:pointer"></select>
      </div>

      <div id="camBox">
        <video id="camVid" playsinline muted></video>
        <div id="cropBox"></div>
        <div id="camOff"><i class="fa-solid fa-video-slash fa-2x"></i><span>카메라가 꺼져 있어요</span></div>
      </div>
      <div class="privnote">찍은 사진은 이 컴퓨터 밖으로 나가지 않아요</div>

      <button class="db" id="addFiles" disabled style="width:100%;margin-top:9px;justify-content:center">
        <i class="fa-solid fa-image"></i> 사진 파일로 시험하기
      </button>
      <input type="file" id="fileInput" accept="image/*">

      <div id="seeWrap">
        <div id="seeHead"><i class="fa-solid fa-eye"></i>AI가 보는 그림
          <span class="st-badge" id="seeState">아직 안 봐요</span></div>
        <div id="seeBody">
          <canvas id="seeCv" width="224" height="224"></canvas>
          <div id="seeNums"><span class="ph2">카메라를 켜면 숫자가 나와요</span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="pan pan-out" id="panR">
    <div class="ph"><i class="fa-solid fa-comment-dots"></i>AI의 답</div>
    <div class="pb">
      <div class="answer idk" id="answer">모델을 골라 주세요</div>
      <div id="exBars"></div>

      <div class="thr">
        <div class="lb"><span>확신 정도</span><span class="num" id="thrVal">60%</span></div>
        <input type="range" id="thrRange" min="20" max="95" step="5" value="60">
        <div class="hint">이보다 덜 확실하면 모르겠어요 라고 답해요.</div>
      </div>

      <div class="sec2">
        <div class="st">모델 정보</div>
        <div id="mdlInfo" class="hint" style="margin-top:0">모델을 고르면 여기에 나와요.</div>
      </div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script src="lib/nav.js?v=1"></script>
<script src="lib/i18n.js?v=1"></script>
<script type="module" src="lib/exam.js?v=1"></script>
</body>
</html>
