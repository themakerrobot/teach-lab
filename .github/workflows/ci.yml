name: CI

# 손으로 맞춰야 하는 것들이 어긋났는지 본다.
# 지금은 하나뿐이다: lib/teachlab_src.js 는 python/teachlab/*.py 를 심어 둔
# 자동 생성 파일이라, 파이썬을 고치고 다시 만들지 않으면 내보낸 zip 이
# 옛날 코드를 담게 된다.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  generated-files:
    name: 자동 생성 파일이 최신인가
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: lib/teachlab_src.js
        run: node tools/gen-teachlab-src.mjs --check

  syntax:
    name: 문법
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 브라우저 JS
        run: for f in lib/*.js; do [ "$(basename "$f")" = jszip.min.js ] || node --check "$f"; done
      - name: 파이썬
        run: python -m compileall -q python/teachlab

  package:
    name: teachlab 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: build + twine check
        run: |
          python -m pip install --upgrade pip build twine
          cd python
          python -m build
          python -m twine check dist/*
