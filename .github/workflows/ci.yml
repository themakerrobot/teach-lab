name: CI

# 손으로 맞춰야 하는 것들이 어긋났는지 본다.
#  · lib/teachlab_src.js 는 python/teachlab/*.py 를 심어 둔 자동 생성 파일이라,
#    파이썬을 고치고 다시 만들지 않으면 내보낸 zip 이 옛날 코드를 담게 된다.
#  · css/themaker-ui.css 는 공용 디자인 킷(themakerrobot/themaker-ui)의 복사본이라,
#    원본이 바뀌었는데 안 가져오거나 이쪽에서 몰래 고치면 자매 서비스와 어긋난다.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  generated-files:
    name: 자동 생성 파일이 최신인가
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: lib/teachlab_src.js
        run: node tools/gen-teachlab-src.mjs --check


  syntax:
    name: 문법
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 브라우저 JS
        run: for f in lib/*.js; do [ "$(basename "$f")" = jszip.min.js ] || node --check "$f"; done
      - name: 파이썬
        run: python -m compileall -q python/teachlab

  package:
    name: teachlab 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: build + twine check
        run: |
          python -m pip install --upgrade pip build twine
          cd python
          python -m build
          python -m twine check dist/*
  design-kit:
    name: 디자인 킷 복사본이 원본과 같은가
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: css/themaker-ui.css
        run: |
          # 태그로 고정한다 — 킷이 바뀌어도 이쪽 CI 가 갑자기 깨지지 않는다.
          # 새 킷을 쓰려면 이 번호를 올리고 파일을 다시 복사한다.
          KIT=v1.0.0
          curl -sSfL -o /tmp/kit.css \
            "https://raw.githubusercontent.com/themakerrobot/themaker-ui/$KIT/themaker-ui.css"
          if ! diff -u /tmp/kit.css css/themaker-ui.css; then
            echo "::error::css/themaker-ui.css 가 디자인 킷 $KIT 과 다릅니다."
            echo "고칠 것이 있으면 themakerrobot/themaker-ui 를 고치고 여기로 다시 복사하세요."
            exit 1
          fi
          echo "디자인 킷 $KIT 과 같습니다"
