name: Build TeachLab.exe

on:
  push:
    tags: ['v*']        # 예: git tag v0.1.0 && git push origin v0.1.0
  workflow_dispatch:     # Actions 탭에서 수동 실행도 가능
    inputs:
      tag:
        description: '릴리스 태그 (예: v0.1.0). 비우면 릴리스 없이 빌드만'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Release 에 exe 첨부용
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Stage site files
        run: |
          mkdir -p build/site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='tools' --exclude='build' \
            --exclude='docs' --exclude='design' --exclude='python' \
            --exclude='README.md' --exclude='DEVELOP.md' --exclude='CLAUDE.md' --exclude='CHANGELOG.md' \
            --exclude='wrangler.toml' --exclude='.assetsignore' --exclude='_headers' \
            --exclude='.gitignore' --exclude='*.zip' --exclude='*.exe' \
            ./ build/site/
          cp tools/portable/main.go tools/portable/go.mod build/

      - name: Embed icon
        run: |
          go install github.com/akavel/rsrc@v0.10.2
          $(go env GOPATH)/bin/rsrc -ico tools/portable/icon.ico -o build/rsrc.syso

      - name: Build exe
        run: cd build && GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o TeachLab.exe .

      - name: Upload artifact (수동 실행용)
        uses: actions/upload-artifact@v4
        with:
          name: TeachLab
          path: build/TeachLab.exe

      - name: Release notes from CHANGELOG.md (태그 push 또는 tag 입력 시)
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # CHANGELOG.md 에서 "### vX.Y.Z — 날짜" 절만 잘라 Release 본문으로 쓴다.
          # 절이 없으면 본문을 비워 두고 Release 는 그대로 만든다.
          awk -v tag="$TAG" '
            /^### / { on = ($2 == tag) ; next }
            /^## /  { on = 0 }
            on      { print }
          ' CHANGELOG.md > build/notes.md
          if [ -s build/notes.md ]; then
            printf '\n---\n`TeachLab.exe` 는 사이트 전체를 담은 오프라인 실행 파일입니다. 더블클릭하면 브라우저가 열려요.\n' >> build/notes.md
          else
            echo "CHANGELOG.md 에 $TAG 절이 없습니다 — 본문 없이 릴리스합니다"
          fi
          cat build/notes.md

      - name: Attach to Release (태그 push 또는 tag 입력 시)
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          files: build/TeachLab.exe
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body_path: build/notes.md
