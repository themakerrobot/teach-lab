name: Publish teachlab to PyPI

# 파이썬 패키지(python/teachlab)를 PyPI 에 올린다.
#
# 토큰을 레포에 저장하지 않는다 — PyPI 의 Trusted Publishing(OIDC)을 쓴다.
# GitHub Actions 가 PyPI 에게 "이 레포의 이 워크플로가 맞다"를 증명하고
# 그때만 쓰는 짧은 자격증명을 받아 온다.
#
# ── 처음 한 번만 하는 설정 (pypi.org 에서, 2분) ──────────────────────────
#   1. https://pypi.org/manage/account/publishing/ 접속
#   2. "Add a new pending publisher" 에 아래 그대로 입력
#        PyPI Project Name : teachlab
#        Owner             : themakerrobot
#        Repository name   : teach-lab
#        Workflow name     : publish-pypi.yml
#        Environment name  : pypi
#   3. 저장
#
# ── 올리기 ─────────────────────────────────────────────────────────────
#   Actions 탭 → 이 워크플로 → Run workflow (target: pypi)
#   또는 태그로:  git tag py-v0.3.0 && git push origin py-v0.3.0
#
# 같은 버전 번호는 PyPI 에 두 번 올릴 수 없다. 올리기 전에
# python/pyproject.toml 과 python/teachlab/__init__.py 의 버전을 올릴 것.

on:
  push:
    tags: ['py-v*']        # 예: py-v0.3.0  (exe 빌드의 v* 와 겹치지 않게)
  workflow_dispatch:
    inputs:
      target:
        description: '어디에 올릴까요'
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          cd python
          python -m build
          python -m twine check dist/*

      - name: Show what will be uploaded
        run: ls -la python/dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist

  testpypi:
    # 태그로 올릴 때는 건너뛰고, 수동 실행에서 testpypi 를 고른 경우만
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write        # Trusted Publishing 에 필요
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    if: startsWith(github.ref, 'refs/tags/py-v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # Trusted Publishing 에 필요
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
