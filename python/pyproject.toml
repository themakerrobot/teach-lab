[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teachlab"
version = "0.4.0"
description = "Teach Lab 에서 가르친 모델(이미지·손·얼굴·포즈·소리)을 파이썬에서 그대로 실행합니다."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "the maker robot" }]
keywords = ["teachable-machine", "mediapipe", "image-classification", "education", "on-device"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# 기본 설치는 가볍게 — 이미지 모델만으로도 바로 돌아간다 (약 110MB).
# 손·얼굴·포즈·소리는 MediaPipe 가 있어야 하므로 따로 받는다 (약 +700MB).
dependencies = [
  "numpy>=1.21",
  "ai-edge-litert>=1.0",
  "pillow>=9",
]

[project.optional-dependencies]
landmark = ["mediapipe>=0.10.9"]          # 손 · 얼굴 · 포즈
sound = ["mediapipe>=0.10.9"]             # 소리 (YAMNet)
webcam = ["opencv-python>=4.8"]           # webcam.py / teachlab webcam
mic = ["sounddevice>=0.4"]                # listen.py / teachlab listen
all = [
  "mediapipe>=0.10.9",
  "opencv-python>=4.8",
  "sounddevice>=0.4",
]

[project.scripts]
teachlab = "teachlab.cli:main"

[tool.setuptools.packages.find]
include = ["teachlab*"]
