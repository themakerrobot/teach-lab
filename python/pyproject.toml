[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teachlab"
version = "0.1.0"
description = "Teach Lab 에서 가르친 이미지 분류 모델을 파이썬에서 그대로 실행합니다."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "the maker robot" }]
keywords = ["teachable-machine", "mediapipe", "image-classification", "education", "on-device"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.21",
  "mediapipe>=0.10.9",
]

[project.optional-dependencies]
webcam = ["opencv-python>=4.8"]

[project.scripts]
teachlab = "teachlab.cli:main"

[tool.setuptools.packages.find]
include = ["teachlab*"]
